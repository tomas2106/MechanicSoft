spring.application.name=mechanicsoft
server.port=${PORT:8080}

# Conexión PostgreSQL (Neon en producción / Local en desarrollo)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mechanicsoft}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool de conexiones optimizado para Neon (evita cortes por inactividad)
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=240000
spring.datasource.hikari.max-lifetime=290000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.validation-timeout=5000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Zona horaria oficial Colombia
spring.jackson.time-zone=America/Bogota

# Límite para subida de logos/fotos en Base64
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=10MB